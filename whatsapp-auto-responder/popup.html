<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Auto Responder</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <span class="logo">🤖</span>
      <h1>Auto Responder</h1>
      <label class="toggle-switch" title="Attiva/Disattiva">
        <input type="checkbox" id="toggleEnabled">
        <span class="slider"></span>
      </label>
    </header>

    <div id="statusBar" class="status-bar off">
      <span id="statusText">Disattivato</span>
    </div>

    <!-- Provider AI -->
    <section class="section">
      <h2>Intelligenza Artificiale</h2>

      <div class="field">
        <label for="provider">Provider</label>
        <select id="provider">
          <option value="claude">Claude (Anthropic)</option>
          <option value="openai">OpenAI (ChatGPT)</option>
        </select>
      </div>

      <!-- Claude -->
      <div id="claudeSection">
        <div class="field">
          <label for="claudeApiKey">API Key Claude</label>
          <div class="input-wrapper">
            <input type="password" id="claudeApiKey" placeholder="sk-ant-api03-..." autocomplete="off">
            <button class="eye-btn" data-target="claudeApiKey" title="Mostra/Nascondi">👁</button>
          </div>
        </div>
        <div class="field">
          <label for="claudeModel">Modello</label>
          <select id="claudeModel">
            <option value="claude-haiku-4-5-20251001">Claude Haiku (veloce, economico)</option>
            <option value="claude-sonnet-4-6">Claude Sonnet (bilanciato)</option>
            <option value="claude-opus-4-6">Claude Opus (migliore qualità)</option>
          </select>
        </div>
      </div>

      <!-- OpenAI -->
      <div id="openaiSection" class="hidden">
        <div class="field">
          <label for="openaiApiKey">API Key OpenAI</label>
          <div class="input-wrapper">
            <input type="password" id="openaiApiKey" placeholder="sk-..." autocomplete="off">
            <button class="eye-btn" data-target="openaiApiKey" title="Mostra/Nascondi">👁</button>
          </div>
        </div>
        <div class="field">
          <label for="openaiModel">Modello</label>
          <select id="openaiModel">
            <option value="gpt-4o-mini">GPT-4o Mini (veloce, economico)</option>
            <option value="gpt-4o">GPT-4o (migliore qualità)</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Prompt di sistema -->
    <section class="section">
      <h2>Personalità</h2>
      <div class="field">
        <label for="systemPrompt">Istruzioni per l'AI</label>
        <textarea id="systemPrompt" rows="4" placeholder="Descrivi come deve rispondere l'AI..."></textarea>
      </div>
    </section>

    <!-- Ritardo -->
    <section class="section">
      <h2>Comportamento</h2>
      <div class="field row">
        <label>Ritardo risposta</label>
        <div class="delay-inputs">
          <div class="delay-group">
            <span>min</span>
            <input type="number" id="minDelay" min="1" max="30" step="0.5">
            <span>s</span>
          </div>
          <span>—</span>
          <div class="delay-group">
            <span>max</span>
            <input type="number" id="maxDelay" min="1" max="60" step="0.5">
            <span>s</span>
          </div>
        </div>
      </div>
      <p class="hint">Un ritardo casuale rende le risposte più naturali</p>
    </section>

    <!-- Azioni -->
    <div class="actions">
      <button id="saveBtn" class="btn-primary">Salva impostazioni</button>
      <button id="resetBtn" class="btn-secondary">Ripristina default</button>
    </div>

    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
